name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pubg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d pubg_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/pubg_test
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 패키지 설치
        run: python -m pip install -r requirements-dev.txt

      - name: 코드 검사
        run: |
          ruff check .
          ruff format --check .

      - name: 테스트 실행
        run: pytest